name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Held at v5 (MIT): v6 bundles a proprietary caching component under
      # Gradle's separate terms of use, pending Splash's decision.
      - uses: gradle/actions/wrapper-validation@v5
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests, lint, debug build
        run: ./gradlew testDevDebugUnitTest lintDevDebug assembleDevDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: app/build/reports/
